on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest ]
      fail-fast: false
    steps:
      - uses: actions/checkout@v5

      - if: runner.os == 'Linux'
        run: sudo apt install libgtest-dev

      - run: |
          cmake -DCMAKE_BUILD_TYPE=Release -GNinja -Bbuild
          cmake --build build
          ctest --test-dir build